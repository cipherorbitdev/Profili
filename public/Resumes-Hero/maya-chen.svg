<svg xmlns="http://www.w3.org/2000/svg" width="630" height="840" viewBox="0 0 630 840">
  <title id="title">Maya Chen resume</title>
  <rect width="630" height="840" fill="#F4F7F9"/>
  <rect x="36" y="36" width="558" height="768" fill="#FFFFFF" stroke="#012A4A" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="8" height="768" fill="#2C7DA0"/>
  <rect x="72" y="64" width="72" height="72" rx="8" fill="#012A4A"/>
  <text x="108" y="110" text-anchor="middle" fill="#89C2D9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">MC</text>
  <text x="164" y="94" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">Maya Chen</text>
  <text x="164" y="122" fill="#2A6F97" font-family="ui-monospace, monospace" font-size="13">Founder &amp; Product Architect ù Loomstack</text>
  <text x="72" y="172" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">SUMMARY</text>
  <text x="72" y="196" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Product architect for handheld hardware with a type-first eye.</text>
  <text x="72" y="216" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Lisbon and Taipei. One object, finished.</text>
  <text x="72" y="252" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">EXPERIENCE</text>
  <text x="72" y="278" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Loomstack</text>
  <text x="72" y="298" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Founder &amp; Product Architect ù 2016  Present</text>
  <text x="72" y="322" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Shipped Loom 1: 312g chassis, matte optical stack, no-lag stylus.</text>
  <text x="72" y="340" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">40-person hardware and design crew. Series B for the hinge, not a pivot.</text>
  <text x="72" y="372" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Verdant Labs</text>
  <text x="72" y="392" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Director of Product ù 2009  2016</text>
  <text x="72" y="416" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Fieldleaf tablet for survey crews. Cut returns 18% via glare and travel.</text>
  <text x="72" y="448" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Halcyon Atelier</text>
  <text x="72" y="468" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Resident maker ù 2008  2009</text>
  <text x="72" y="492" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Night studio on letterspacing. Left when the work turned into catalogs.</text>
  <text x="72" y="532" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">EDUCATION</text>
  <text x="72" y="556" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Westmere College of Art</text>
  <text x="72" y="576" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">BFA, Graphic Form ù 2004  2008</text>
  <text x="72" y="616" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">SKILLS</text>
  <text x="72" y="640" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Typography ù Loomstack ù Verdant ù Product ù Hardware</text>
</svg>
