<svg xmlns="http://www.w3.org/2000/svg" width="630" height="840" viewBox="0 0 630 840">
  <title id="title">Dario Reyes resume</title>
  <rect width="630" height="840" fill="#F4F7F9"/>
  <rect x="36" y="36" width="558" height="768" fill="#FFFFFF" stroke="#012A4A" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="8" height="768" fill="#01497C"/>
  <rect x="72" y="64" width="72" height="72" rx="8" fill="#012A4A"/>
  <text x="108" y="110" text-anchor="middle" fill="#89C2D9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">DR</text>
  <text x="164" y="94" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">Dario Reyes</text>
  <text x="164" y="122" fill="#2A6F97" font-family="ui-monospace, monospace" font-size="13">Founder &amp; Chief Engineer ù Orbital Forge</text>
  <text x="72" y="172" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">SUMMARY</text>
  <text x="72" y="196" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Chief engineer for small-lift vehicles and ground power.</text>
  <text x="72" y="216" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Two lost vehicles, then a clean insertion. He will show the plot.</text>
  <text x="72" y="252" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">EXPERIENCE</text>
  <text x="72" y="278" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Orbital Forge</text>
  <text x="72" y="298" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Founder &amp; Chief Engineer ù 2014  Present</text>
  <text x="72" y="322" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Kite-4 held 410 km circular for eleven orbits in 2019.</text>
  <text x="72" y="340" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Harbor logistics contract. Headcount 220 across two sites.</text>
  <text x="72" y="372" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Ionvolt</text>
  <text x="72" y="392" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Founder ù 2010  2014</text>
  <text x="72" y="416" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">40 MWh neighborhood storage block. Sold the line to fund the pad.</text>
  <text x="72" y="448" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Drift Robotics</text>
  <text x="72" y="468" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Chair ù 2018  Present</text>
  <text x="72" y="492" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Yard tugs for ports. Signs the battery spec, not the standup.</text>
  <text x="72" y="532" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">EDUCATION</text>
  <text x="72" y="556" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Calder Technical Institute</text>
  <text x="72" y="576" fill="#2A6F97" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">B.S. Aerospace Systems ù 2001  2005</text>
  <text x="72" y="616" fill="#468FAF" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">SKILLS</text>
  <text x="72" y="640" fill="#012A4A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Guidance ù Orbital Forge ù Ionvolt ù Energy ù Robotics</text>
</svg>
